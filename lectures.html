<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>성경 강의 | HONG-BRIDGE</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css">
<style>
  :root{
    --cream:#F7EFD8;
    --cream-deep:#EFE2B9;
    --card:#FFFDF6;
    --line:#D9C89A;
    --brown:#5B3A1E;
    --ink:#2B2013;
    --ink-soft:#5A4A34;
    --ink-faint:#8A6A3E;
    --footer-bg:#2B2013;
    --footer-text:#F7EFD8;
    --tag-bg:#F1E4BE;
    --tag-text:#5B3A1E;
  }
  @media (prefers-color-scheme: dark){
    :root{
      --cream:#1C1610;
      --cream-deep:#241C13;
      --card:#2A2117;
      --line:#4A3C28;
      --brown:#E3A15B;
      --ink:#F3EAD3;
      --ink-soft:#D9CAA8;
      --ink-faint:#B69A6B;
      --tag-bg:#4A3C28;
      --tag-text:#F3EAD3;
    }
    .brand-mark img{filter:invert(1) brightness(2);}
  }
  *{box-sizing:border-box;}
  body{margin:0;font-family:'Pretendard',sans-serif;background:var(--cream);color:var(--ink);line-height:1.6;}
  h1,h2,h3,.brand{font-family:'Pretendard',sans-serif;}
  a{color:inherit;text-decoration:none;}
  img{max-width:100%;display:block;}

  header{
    display:flex;align-items:center;justify-content:space-between;
    padding:18px 6vw;border-bottom:2px solid var(--brown);
    position:sticky;top:0;background:var(--cream);z-index:10;
  }
  .brand-mark{display:flex;align-items:center;gap:12px;}
  .brand-mark img{height:34px;width:auto;}
  .brand{font-size:22px;font-weight:700;letter-spacing:.3px;}
  nav{display:flex;align-items:center;gap:26px;font-size:15px;font-weight:500;}
  nav a.cta{padding:9px 18px;background:var(--brown);color:var(--cream);border-radius:4px;}
  .icon-btn{background:none;border:none;cursor:pointer;color:var(--ink);display:flex;align-items:center;padding:2px;}
  .lang-select{position:relative;}
  .lang-btn{background:none;border:none;cursor:pointer;color:var(--ink);display:flex;align-items:center;gap:6px;font-size:14px;font-weight:500;font-family:inherit;padding:2px;}
  .lang-menu{display:none;position:absolute;top:100%;right:0;margin-top:10px;background:var(--card);border:1px solid var(--line);border-radius:6px;overflow:hidden;min-width:110px;box-shadow:0 6px 16px rgba(43,32,19,.15);z-index:20;}
  .lang-select.open .lang-menu{display:block;}
  .lang-menu a{display:block;padding:9px 14px;font-size:13.5px;color:var(--ink);}
  .lang-menu a:hover{background:var(--cream-deep);}
  .menu-toggle{display:none;background:none;border:none;cursor:pointer;color:var(--ink);padding:4px;}

  .hero{
    padding:96px 6vw 80px;display:flex;flex-direction:column;align-items:center;
    text-align:center;gap:26px;border-bottom:1px solid var(--line);
  }
  .hero p.lede{margin:0;font-size:14px;font-weight:700;color:var(--ink-faint);letter-spacing:.3px;}
  .hero h1{margin:0;font-size:clamp(32px,4.4vw,50px);line-height:1.4;font-weight:900;max-width:840px;}
  .hero p.sub{margin:0;font-size:18px;color:var(--ink-soft);max-width:600px;}
  .btn-row{display:flex;gap:14px;margin-top:6px;flex-wrap:wrap;justify-content:center;}
  .btn{padding:13px 28px;border-radius:4px;font-weight:700;font-size:15px;}
  .btn-solid{background:var(--brown);color:var(--cream);}
  .btn-outline{background:transparent;color:var(--brown);border:2px solid var(--brown);}

  section{padding:56px 6vw;}
  .section-head{display:flex;align-items:baseline;justify-content:space-between;gap:16px;flex-wrap:wrap;margin-bottom:26px;}
  .section-head h2{margin:0;font-size:24px;font-weight:700;}
  .section-head a.more{font-size:14px;font-weight:700;color:var(--brown);white-space:nowrap;}
  .section-more{display:flex;justify-content:center;margin-top:28px;}
  .section-more a{padding:12px 30px;border:1.5px solid var(--brown);border-radius:999px;font-size:14px;font-weight:700;color:var(--brown);}
  .section-more a:hover{background:var(--brown);color:var(--cream);}

  .lecture-list{background:var(--card);border:1px solid var(--line);border-radius:6px;overflow:hidden;}
  .lecture-row{display:flex;align-items:center;gap:20px;padding:22px 24px;border-bottom:1px solid var(--line);}
  .lecture-row:last-child{border-bottom:none;}
  .lecture-title{font-size:16.5px;font-weight:700;white-space:nowrap;}
  .lecture-desc{flex-grow:1;font-size:14px;color:var(--ink-soft);}
  .lecture-row .arrow{color:var(--ink-faint);font-size:16px;}

  .grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:22px;}
  .card{background:var(--card);border:1px solid var(--line);border-radius:6px;overflow:hidden;display:flex;flex-direction:column;}
  .card .thumb{width:100%;height:160px;background:#E8DCB8;display:flex;align-items:center;justify-content:center;color:#A6905F;font-size:13px;position:relative;}
  .card .thumb.video::after{
    content:"▶";position:absolute;width:52px;height:52px;border-radius:50%;
    background:rgba(43,32,19,.72);color:#F7EFD8;display:flex;align-items:center;justify-content:center;
    font-size:18px;
  }
  .card .body{padding:18px 20px 20px;display:flex;flex-direction:column;gap:9px;}
  .card .cat{font-size:12px;font-weight:700;color:var(--ink-faint);}
  .card h3{margin:0;font-size:17px;line-height:1.5;}
  .card p{margin:0;font-size:13.5px;color:var(--ink-soft);}
  .tags{display:flex;gap:6px;flex-wrap:wrap;margin-top:4px;}
  .tag{font-size:11px;padding:4px 10px;background:var(--tag-bg);color:var(--tag-text);border-radius:999px;}

  .tag-section{background:var(--cream-deep);}
  .tag-section h2{font-size:24px;margin:6px 0 4px;}
  .tag-section .kicker{font-size:13px;font-weight:700;color:var(--ink-faint);}
  .tag-list{background:var(--card);border:1px solid var(--line);border-radius:6px;overflow:hidden;margin-top:20px;}
  .tag-row{display:flex;align-items:center;gap:18px;padding:18px 22px;border-bottom:1px solid var(--line);}
  .tag-row:last-child{border-bottom:none;}
  .tag-row .pill{font-size:11px;font-weight:700;padding:4px 10px;background:var(--tag-bg);color:var(--tag-text);border-radius:999px;white-space:nowrap;}
  .tag-row .title{flex-grow:1;font-size:15.5px;}
  .tag-row .date{font-size:13px;color:var(--ink-faint);white-space:nowrap;}

  .intro{display:flex;gap:48px;align-items:center;}
  .intro .photo{width:220px;height:220px;flex-shrink:0;background:#E8DCB8;border-radius:6px;display:flex;align-items:center;justify-content:center;color:#A6905F;font-size:13px;}
  .intro .text{max-width:600px;display:flex;flex-direction:column;gap:14px;}
  .intro .kicker{font-size:13px;font-weight:700;color:var(--ink-faint);}
  .intro h2{margin:0;font-size:26px;font-weight:700;}
  .intro p{margin:0;font-size:15.5px;color:var(--ink-soft);}
  .intro .more{font-size:14.5px;font-weight:700;color:var(--brown);}

  footer{background:var(--footer-bg);color:var(--footer-text);padding:44px 6vw;}
  .foot-row{display:flex;justify-content:space-between;gap:28px;flex-wrap:wrap;}
  .foot-brand{display:flex;align-items:center;gap:10px;}
  .foot-brand img{height:26px;width:auto;filter:invert(1) brightness(2);}
  .foot-brand span{font-size:17px;font-weight:700;}
  .badges{display:flex;flex-direction:column;gap:10px;margin-top:16px;}
  .badges .badge{display:flex;align-items:center;gap:9px;font-size:13px;color:#C9B68A;}
  .badges .badge img{height:20px;width:20px;object-fit:contain;flex-shrink:0;}
  .foot-contact .label{font-size:12px;font-weight:700;color:#C9B68A;margin-bottom:8px;}
  .contact-label{color:#E3A15B;letter-spacing:1.5px;}
  .foot-contact div.row{font-size:13.5px;margin-top:6px;}
  .social-row{display:flex;gap:10px;margin-top:14px;}
  .social-btn{width:34px;height:34px;border-radius:50%;background:rgba(247,239,216,.12);display:flex;align-items:center;justify-content:center;color:#F7EFD8;}
  .social-btn:hover{background:rgba(247,239,216,.22);}
  .social-btn svg{width:16px;height:16px;}
  .copyright{border-top:1px solid #4A3C28;margin-top:26px;padding-top:18px;font-size:12px;color:#A6905F;}

  @media (max-width:900px){
    .menu-toggle{display:block;}
    nav{
      display:none;position:absolute;top:100%;left:0;right:0;
      flex-direction:column;align-items:flex-start;gap:2px;
      background:var(--cream);border-bottom:2px solid var(--brown);
      padding:8px 6vw 20px;box-shadow:0 12px 20px rgba(43,32,19,.12);
    }
    nav.nav-open{display:flex;}
    nav a{width:100%;padding:12px 4px;border-bottom:1px solid var(--line);}
    nav a.cta{width:auto;border-bottom:none;margin-top:10px;}
    .icon-btn{padding:12px 4px;}
    .lang-select{width:100%;}
    .lang-btn{padding:12px 4px;width:100%;}
    .lang-menu{position:static;box-shadow:none;border:none;margin-top:0;width:100%;}
    .grid2{grid-template-columns:1fr;}
    .lecture-row{flex-wrap:wrap;gap:6px;}
    .lecture-desc{width:100%;}
  }
</style>

<style>
  .lec-wrap{max-width:760px;margin:0 auto;padding:64px 6vw 40px;}
  .lec-wrap h1{margin:0 0 10px;font-size:clamp(26px,4vw,34px);font-weight:900;}
  .lec-wrap .lec-intro{margin:0 0 32px;font-size:15.5px;color:var(--ink-soft);}
  .course-tabs{display:flex;gap:10px;margin-bottom:28px;flex-wrap:wrap;}
  .course-tab{padding:11px 22px;border-radius:999px;border:1.5px solid var(--brown);background:transparent;color:var(--brown);font-size:14.5px;font-weight:700;font-family:inherit;cursor:pointer;}
  .course-tab.active{background:var(--brown);color:var(--cream);}
  .course-summary{font-size:14.5px;color:var(--ink-soft);margin-bottom:24px;}
  .load-more-wrap{display:flex;justify-content:center;margin-top:24px;}
  .load-more-wrap button{padding:12px 30px;border:1.5px solid var(--brown);border-radius:999px;font-size:14px;font-weight:700;color:var(--brown);background:transparent;font-family:inherit;cursor:pointer;}
  .load-more-wrap button:hover{background:var(--brown);color:var(--cream);}
</style>

</head>

<script>
  var menuToggle = document.getElementById('menu-toggle');
  var mainNav = document.getElementById('main-nav');
  menuToggle.addEventListener('click', function () {
    var isOpen = mainNav.classList.toggle('nav-open');
    menuToggle.setAttribute('aria-expanded', isOpen ? 'true' : 'false');
  });

  var langSelect = document.getElementById('lang-select');
  var langBtn = document.getElementById('lang-btn');
  langBtn.addEventListener('click', function (e) {
    e.stopPropagation();
    langSelect.classList.toggle('open');
  });
  document.addEventListener('click', function () {
    langSelect.classList.remove('open');
  });

  var courses = [];
  var activeCourseId = null;
  var visibleCount = 3;

  var params = new URLSearchParams(window.location.search);
  var courseParam = params.get('course'); // 'ot' or 'nt'

  fetch('data/lectures.json').then(function (r) { return r.json(); }).then(function (data) {
    courses = data;
    if (courseParam === 'ot') activeCourseId = 'ot-10weeks';
    else if (courseParam === 'nt') activeCourseId = 'nt-10weeks';
    else activeCourseId = courses[0] && courses[0].id;

    renderTabs();
    renderCourse();
  });

  function renderTabs() {
    var wrap = document.getElementById('course-tabs');
    wrap.innerHTML = '';
    courses.forEach(function (c) {
      var btn = document.createElement('button');
      btn.className = 'course-tab' + (c.id === activeCourseId ? ' active' : '');
      btn.textContent = c.title;
      btn.addEventListener('click', function () {
        activeCourseId = c.id;
        visibleCount = 3;
        renderTabs();
        renderCourse();
      });
      wrap.appendChild(btn);
    });
  }

  function renderCourse() {
    var course = courses.filter(function (c) { return c.id === activeCourseId; })[0];
    if (!course) return;

    document.getElementById('course-summary').textContent = course.summary || '';

    var listEl = document.getElementById('week-list');
    listEl.innerHTML = '';
    var weeks = course.weeks || [];
    weeks.slice(0, visibleCount).forEach(function (w) {
      var a = document.createElement('a');
      a.className = 'lecture-row';
      a.href = 'article.html?id=' + encodeURIComponent(w.id);
      a.innerHTML =
        '<span class="lecture-title">' + w.week + '강. ' + w.title + '</span>' +
        '<span class="lecture-desc">' + (w.summary || '') + '</span>' +
        '<span class="arrow">→</span>';
      listEl.appendChild(a);
    });

    var moreWrap = document.getElementById('load-more-wrap');
    moreWrap.style.display = weeks.length > visibleCount ? 'flex' : 'none';
  }

  document.getElementById('load-more').addEventListener('click', function () {
    visibleCount += 3;
    renderCourse();
  });
</script>

</body>
</html>
